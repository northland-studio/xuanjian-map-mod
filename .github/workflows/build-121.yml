name: Build 1.21.x

# 构建 1.21 分支：JDK 21 + Gradle 9.5.1（wrapper）→ 编译 + 单元测试 + mock 契约集成测试 → 产物/报告
# 本地禁止执行 Gradle（规范第三节），所有构建只在 GitHub Actions 跑。

on:
  push:
    branches: [1.21]
  pull_request:
    branches: [1.21]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (compile + unit tests)
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > gradle-build.log 2>&1
          echo "$?" > .build-exit
          tail -80 gradle-build.log
          if [ "$(cat .build-exit)" != "0" ]; then
            echo "===== 关键错误行 ====="
            grep -nE "error:|FAILURE|What went wrong|Could not|could not|No matching|Exception|Caused by" gradle-build.log | tail -n 80 || true
            exit 1
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuanjianmap-121-jars
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuanjianmap-121-test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuanjianmap-121-build-log
          path: gradle-build.log
          if-no-files-found: warn
