plugins {
	// 1.21 分支沿用 xuanjian-mod 的 fabric-loom-remap（官方映射 + remap）
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// 本地 GIS 缓存使用的 SQLite JDBC 驱动（随模组 jar-in-jar 打包，不依赖外部安装）
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"xuanjianmap" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// 客户端 gametest：真实启动一次客户端 → 建测试世界 → 采集/缓存/HUD/叠加 → 逐页截图（CI 里跑）
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "xuanjianmap-test"
		eula = true
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 本地缓存：SQLite（规范要求）。驱动随 jar 打包，运行时自解压 native。
	implementation "org.xerial:sqlite-jdbc:${project.sqlite_version}"
	include "org.xerial:sqlite-jdbc:${project.sqlite_version}"

	// 上传压缩：纯 Java zstd（契约推荐 Content-Encoding: zstd，不引入 native 依赖）
	implementation "io.airlift:aircompressor:${project.aircompressor_version}"
	include "io.airlift:aircompressor:${project.aircompressor_version}"

	// 单元测试（纯 Java 核心在 main，测试不依赖 Minecraft 运行时）
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "com.google.code.gson:gson:${project.gson_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

test {
	useJUnitPlatform()
	systemProperty "java.awt.headless", "true"
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
	reports {
		junitXml.required = true
		html.required = true
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// 客户端 gametest：CI 无头环境下关闭网络同步器（Fabric 官方建议），避免偶发失败
tasks.configureEach { t ->
	if (t.name == "runClientGameTest" || t.name == "runProductionClientGameTest") {
		if (t.hasProperty("jvmArgs")) {
			t.jvmArgs "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
		}
	}
}
